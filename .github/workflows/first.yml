name: "first workflow"

on:
  push:
  pull_request:
    branches:
     - main
     - dev
     - qa

jobs:
  first-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "setup node.js in VM"
        uses: actions/setup-node@v4
        with: 
          node-verison: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run ESlint in app
        run: npm run lint

      - name: run test cases
        run: npm run test

      - name: Make React build
        run: npm run build
  
  deploy-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        run: vercel --prod --yes --token="${{secrets.VERCEL_TOKEN}}"